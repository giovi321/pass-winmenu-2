version: 2
updates:
  # NuGet packages across the solution.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # The GitHub Actions used by the CI and release workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      # init and analyze must move together: CodeQL refuses to run when the
      # config written by init comes from a different version than analyze.
      codeql-action:
        patterns:
          - "github/codeql-action*"
