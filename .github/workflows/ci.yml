name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Minimal default permissions; the job only needs to read the repo.
permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags so the csproj PreBuild `git describe --tags` works.
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore pass-winmenu.sln

      - name: Build
        run: dotnet build pass-winmenu.sln -c Release --no-restore

      - name: Test
        run: dotnet test pass-winmenu.sln -c Release --no-build --verbosity normal
