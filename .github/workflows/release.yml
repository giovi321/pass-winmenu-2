name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

# Needed so the job can attach the built exe to the release.
# (The repo default token is read-only; this grants write just for this workflow.)
permissions:
  contents: write

jobs:
  publish:
    name: Publish single-file exe
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history and tags so the version embeds correctly (git describe --tags).
          fetch-depth: 0

      - name: Set up .NET 8
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Publish
        # Self-contained single-file exe: the .NET Desktop Runtime is bundled,
        # so users don't need to install it separately.
        run: dotnet publish pass-winmenu/pass-winmenu.csproj -c Release -r win-x64 -p:SelfContained=true

      - name: Package
        id: package
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $pub = "pass-winmenu/bin/Release/net8.0-windows10.0.19041.0/win-x64/publish"
          $tag = "$env:TAG"
          if (-not $tag) { $tag = git describe --tags }
          $ver = $tag.TrimStart('v')
          $stage = "staging"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "$pub/pass-winmenu.exe" $stage
          Copy-Item "$pub/pass-winmenu.dll.config" $stage
          $zip = "pass-winmenu-$ver-win-x64.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $zip -Force
          "zip=$zip" >> $env:GITHUB_OUTPUT
          # Publish a SHA-256 sum so users can verify the download.
          $sum = "$zip.sha256"
          "$((Get-FileHash $zip -Algorithm SHA256).Hash.ToLower())  $zip" | Out-File -Encoding ascii $sum
          "sum=$sum" >> $env:GITHUB_OUTPUT

      - name: Attach build to the release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$env:TAG" "${{ steps.package.outputs.zip }}" "${{ steps.package.outputs.sum }}" --clobber

      - name: Upload build as a workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pass-winmenu-win-x64
          path: ${{ steps.package.outputs.zip }}
